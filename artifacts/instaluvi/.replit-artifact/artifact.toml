kind = "web"
previewPath = "/"
title = "INSTALUVI"
version = "1.0.0"
id = "artifacts/instaluvi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20745

[services.development]
run = "pnpm --filter @workspace/instaluvi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/instaluvi", "run", "build" ]
publicDir = "artifacts/instaluvi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20745"
BASE_PATH = "/"
